{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p class="meta"><time datetime="{{ post.date }}">{{ post.date_display }}</time> &middot; {{ post.reading_time }} min read</p>
  {% if post.toc_html %}{{ post.toc_html | safe }}{% endif %}
  {{ post.html | safe }}
</article>
<script>
(function(){
  // Theme any embedded tweets to match the site's light/dark toggle. Only
  // does anything on posts that actually embed a tweet — a no-op elsewhere.
  //
  // widgets.js doesn't just hide the original <blockquote> once it renders
  // an iframe for it — it removes it from the DOM outright. So re-theming
  // on toggle can't just tweak `data-theme` and re-scan; there's nothing
  // left to scan. Instead each tweet gets a stable wrapper slot holding a
  // saved copy of the original markup, which gets replayed fresh into the
  // slot (wiping out whatever iframe was there) before every render.
  var slots = Array.prototype.map.call(
    document.querySelectorAll('blockquote.twitter-tweet'),
    function(bq){
      var slot = document.createElement('div');
      slot.className = 'tweet-embed';
      bq.parentNode.replaceChild(slot, bq);
      return { el: slot, html: bq.outerHTML };
    }
  );
  if(!slots.length) return;

  function currentTheme(){
    return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
  }

  function renderTweets(){
    slots.forEach(function(slot){
      slot.el.innerHTML = slot.html;
      slot.el.firstElementChild.setAttribute('data-theme', currentTheme());
    });
    if(window.twttr && window.twttr.widgets){
      window.twttr.widgets.load();
    }
  }

  // Twitter's official async-loader snippet.
  window.twttr = (function(d, s, id){
    var js, fjs = d.getElementsByTagName(s)[0], t = window.twttr || {};
    if(d.getElementById(id)) return t;
    js = d.createElement(s); js.id = id;
    js.src = "https://platform.twitter.com/widgets.js";
    fjs.parentNode.insertBefore(js, fjs);
    t._e = []; t.ready = function(f){ t._e.push(f); };
    return t;
  }(document, "script", "twitter-wjs"));

  window.twttr.ready(renderTweets);

  var btn = document.getElementById('theme-toggle');
  if(btn){
    btn.addEventListener('click', function(){
      // Run AFTER base.html's handler flips data-theme.
      setTimeout(renderTweets, 0);
    });
  }
})();
</script>
{% if site.giscus %}
<section class="comments" aria-label="Comments">
  <h2>Comments</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="{{ site.giscus.mapping }}"
          data-strict="{{ site.giscus.strict }}"
          data-reactions-enabled="{{ site.giscus.reactions_enabled }}"
          data-emit-metadata="0"
          data-input-position="{{ site.giscus.input_position }}"
          data-theme="preferred_color_scheme"
          data-lang="en"
          data-loading="{{ site.giscus.loading }}"
          crossorigin="anonymous"
          async></script>
  <noscript>Comments require JavaScript. Open the post on <a href="https://github.com/{{ site.giscus.repo }}/discussions">GitHub Discussions</a>.</noscript>
</section>
<script>
(function(){
  // Bridge our theme toggle to giscus iframe. giscus injects the iframe
  // asynchronously, so we both (a) hook the click handler for runtime
  // toggles and (b) listen for the iframe's first message to set the
  // initial theme on load.
  function applyGiscusTheme(theme){
    var f = document.querySelector('iframe.giscus-frame');
    if(!f || !f.contentWindow) return;
    f.contentWindow.postMessage(
      {giscus:{setConfig:{theme: theme === 'dark' ? 'dark' : 'light'}}},
      'https://giscus.app'
    );
  }
  var btn = document.getElementById('theme-toggle');
  if(btn){
    btn.addEventListener('click', function(){
      // Run AFTER base.html's handler flips data-theme.
      setTimeout(function(){
        applyGiscusTheme(document.documentElement.dataset.theme);
      }, 0);
    });
  }
  window.addEventListener('message', function(e){
    if(e.origin !== 'https://giscus.app') return;
    if(e.data && e.data.giscus){
      applyGiscusTheme(document.documentElement.dataset.theme);
    }
  });
})();
</script>
{% endif %}
{% endblock %}
