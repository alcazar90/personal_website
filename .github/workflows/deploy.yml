name: Build and deploy

on:
  push:
    branches:
      - master
      - rust-ssg
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  CARGO_TERM_COLOR: always
  # Pinned rustoki release (https://github.com/alcazar90/rustoki/tags).
  # Bump deliberately when you want to ship a new generator version.
  RUSTOKI_VERSION: v0.2.1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install rustoki
        run: cargo install --git https://github.com/alcazar90/rustoki --tag "$RUSTOKI_VERSION" --locked

      # Derivatives are gitignored, so without this every deploy re-encodes
      # all ~54 images from scratch. Keyed on the image sources: touch one and
      # the whole cache is rebuilt, which the build's own mtime check and
      # stale-derivative pruning would handle anyway.
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: images-${{ hashFiles('content/static/**/*.png', 'content/static/**/*.jpg', 'content/static/**/*.jpeg', 'content/static/**/*.gif', 'content/static/**/*.JPG') }}

      # rustoki's image pipeline shells out to libwebp. It degrades
      # gracefully when these are missing, which is right for local builds
      # but wrong here: a silent degradation would ship the site's images
      # unoptimized. Install them, then fail loudly if they're absent.
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Verify image tools are available
        run: |
          command -v cwebp >/dev/null || { echo "::error::cwebp missing — images would ship unoptimized"; exit 1; }
          command -v gif2webp >/dev/null || { echo "::error::gif2webp missing — GIFs would ship unoptimized"; exit 1; }

      - name: Build site
        run: rustoki build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy public --project-name=alkzar --branch=main
